<app-avatar-circle
  *ngIf="profile() as profile"
  class="size-32"
  [profile]="profile"
/>

<textarea
  [(ngModel)]="postText"
  class="hidden-textarea"
  (input)="onTextAreaInput($event)"
></textarea>

<button class="btn btn-icon" (click)="onCreatePost()">
  <svg icon="send-message"></svg>
</button>

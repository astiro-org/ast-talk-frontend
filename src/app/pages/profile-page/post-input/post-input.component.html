<app-avatar-circle
  *ngIf="profile() as profile"
  class="size-32"
  [avatarUrl]="profile.avatarUrl"
/>

<textarea
  [(ngModel)]="postText"
  class="hidden-textarea"
  (input)="onTextAreaInput($event)"
></textarea>

<button class="btn btn-icon" (click)="onCreatePost()">
  <svg icon="send-message" class="send-message-icon"></svg>
</button>
